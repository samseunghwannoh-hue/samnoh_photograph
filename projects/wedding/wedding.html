<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding — Sam Noh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wedding.css" />
</head>
<body>

  <!-- ── Intro title overlay ──────────────────────────────── -->
  <div id="intro-overlay">
    <span id="intro-title" data-text="Wedding">Wedding</span>
  </div>

  <!-- ── Nav ─────────────────────────────────────────────── -->
  <nav class="project-nav">
    <a href="../../index.html" class="brand">Sam Noh</a>
    <a href="../../index.html" class="back-link">← Back</a>
  </nav>

  <!-- ── Title ────────────────────────────────────────────── -->
  <header class="project-header">
    <h1 class="project-title">Wedding</h1>
  </header>

  <!-- ── Photo grid (populated by wedding.js) ─────────────── -->
  <div id="photoGrid"></div>

  <!-- ── Lightbox ─────────────────────────────────────────── -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-zone" id="lb-prev" aria-label="Previous photo"></div>
    <div class="lb-zone" id="lb-next" aria-label="Next photo"></div>
    <span class="lb-arrow" id="lb-arrow-left">‹</span>
    <span class="lb-arrow" id="lb-arrow-right">›</span>
    <img id="lb-img" src="" alt="" />
    <button id="lb-close" aria-label="Close">✕ close</button>
    <span id="lb-counter"></span>
  </div>

  <script src="wedding.js"></script>
</body>
</html>
