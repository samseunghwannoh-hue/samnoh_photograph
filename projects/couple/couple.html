<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Couple — Sam Noh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="couple.css" />
</head>
<body>
  <div id="page-transition"></div>

  <!-- ── Intro title overlay ──────────────────────────────── -->
  <div id="intro-overlay">
    <span id="intro-title" data-text="Couple">Couple</span>
  </div>

  <!-- ── Nav ─────────────────────────────────────────────── -->
  <nav class="project-nav">
    <a href="../../index.html" class="brand">Sam Noh</a>
    <div class="nav-right">
      <div class="project-nav-links">
        <a href="../../work.html" class="project-nav-link">Work</a>
        <a href="../../contact.html" class="project-nav-link">Contact</a>
      </div>
      <a href="../../index.html" class="back-link">← Back</a>
    </div>
  </nav>

  <!-- ── Filter bar ────────────────────────────────────────── -->
  <div class="filter-bar">
    <div class="filter-row">
      <button class="filter-btn" id="btnTime">time</button>
      <div class="filter-sub" id="filterSubTime"></div>
    </div>
    <div class="filter-row">
      <button class="filter-btn" id="btnPlace">place</button>
      <div class="filter-sub" id="filterSubPlace"></div>
    </div>
  </div>

  <!-- ── Photo grid (populated by couple.js) ──────────────── -->
  <div id="photoGrid"></div>

  <!-- ── Lightbox ─────────────────────────────────────────── -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-zone" id="lb-prev" aria-label="Previous photo"></div>
    <div class="lb-zone" id="lb-next" aria-label="Next photo"></div>
    <span class="lb-arrow" id="lb-arrow-left">‹</span>
    <span class="lb-arrow" id="lb-arrow-right">›</span>
    <img id="lb-img" src="" alt="" />
    <button id="lb-close" aria-label="Close">✕ close</button>
    <span id="lb-counter"></span>
  </div>

  <footer class="site-credit">Inspired by <a href="https://www.jonathangrado.com/" target="_blank" rel="noopener noreferrer">Jonathan Grado's website</a></footer>

  <script src="couple.js"></script>
  <script src="../../transition.js"></script>
</body>
</html>
