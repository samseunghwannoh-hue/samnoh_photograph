<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family — Sam Noh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="family.css" />
</head>
<body>
  <div id="page-transition"></div>

  <!-- ── Intro title overlay ──────────────────────────────── -->
  <div id="intro-overlay">
    <span id="intro-title" data-text="Family">Family</span>
  </div>

  <!-- ── Nav ─────────────────────────────────────────────── -->
  <nav class="project-nav">
    <a href="../../index.html" class="brand">Sam Noh</a>
    <a href="../../index.html" class="back-link">← Back</a>
  </nav>

  <!-- ── Title ────────────────────────────────────────────── -->
  <header class="project-header">
    <h1 class="project-title">Family</h1>
  </header>

  <!-- ── Filter bar ────────────────────────────────────────── -->
  <div class="filter-bar">
    <button class="filter-btn" id="btnTime">time</button>
    <button class="filter-btn" id="btnPlace">place</button>
  </div>

  <!-- ── Photo grid (populated by family.js) ──────────────── -->
  <div id="photoGrid"></div>

  <!-- ── Lightbox ─────────────────────────────────────────── -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-zone" id="lb-prev" aria-label="Previous photo"></div>
    <div class="lb-zone" id="lb-next" aria-label="Next photo"></div>
    <span class="lb-arrow" id="lb-arrow-left">‹</span>
    <span class="lb-arrow" id="lb-arrow-right">›</span>
    <img id="lb-img" src="" alt="" />
    <button id="lb-close" aria-label="Close">✕ close</button>
    <span id="lb-counter"></span>
  </div>

  <script src="family.js"></script>
  <script src="../../transition.js"></script>
</body>
</html>
