<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Couple — Sam Noh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #ffffff;
      --fg:     #111111;
      --fg-dim: rgba(17, 17, 17, 0.38);
      --mono:   'Courier Prime', 'Courier New', Courier, monospace;
      --nav-h:  80px;
      --cols:   8;
      --gap:    3px;
    }

    html { background: var(--bg); color: var(--fg); }
    body { font-family: var(--mono); overflow-x: hidden; }

    /* ── Intro title overlay ─────────────────────────────────
       Transparent background so the page shows through.
       The title uses a chromatic-aberration / anaglyph effect
       (overlapping red + blue ghost copies) for an old-film look.
    ─────────────────────────────────────────────────────────── */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;   /* no solid colour — page shows behind */
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.2s ease;
    }

    #intro-overlay.fade-out { opacity: 0; }

    /*
      Three text layers via pseudo-elements:
        ::before  — red/magenta copy, offset left + down
        main text — dark ink, centre
        ::after   — cyan/blue copy, offset right + up

      mix-blend-mode: multiply blends against the white page so the
      colours deepen where they overlap, recreating the anaglyph look.
      The flicker keyframe adds a brief judder at the start like
      old film catching in a projector gate.
    */
    #intro-title {
      position: relative;
      display: inline-block;
      font-family: var(--mono);
      font-weight: 400;
      font-size: clamp(2.4rem, 8vw, 7rem);
      letter-spacing: 0.06em;
      color: #0d0d0d;
      text-align: center;
      animation: film-load 0.6s steps(1) forwards;
    }

    #intro-title::before,
    #intro-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* Red / magenta ghost — offset left & down */
    #intro-title::before {
      color: #c8003a;
      transform: translate(-6px, 4px);
      opacity: 0.72;
    }

    /* Cyan / blue ghost — offset right & up */
    #intro-title::after {
      color: #0040cc;
      transform: translate(6px, -4px);
      opacity: 0.72;
    }

    /* Old-projector gate-catch: brief stutter on first appear */
    @keyframes film-load {
      0%   { opacity: 0; transform: translateX(-3px); }
      15%  { opacity: 1; transform: translateX( 2px); }
      30%  { opacity: 0; transform: translateX( 0);   }
      45%  { opacity: 1; transform: translateX(-1px); }
      60%  { opacity: 1; transform: translateX( 0);   }
      100% { opacity: 1; transform: translateX( 0);   }
    }

    /* ── Nav ─────────────────────────────────────────────── */
    .project-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 200;
      background: var(--bg);
      border-bottom: 1px solid rgba(17,17,17,0.08);
    }

    .brand {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--fg);
      text-decoration: none;
    }

    .back-link {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--fg); }

    /* ── Project title header ────────────────────────────── */
    .project-header {
      padding: calc(var(--nav-h) + 36px) 40px 32px;
    }

    .project-title {
      font-size: clamp(1rem, 2vw, 1.6rem);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* ── Photo grid ──────────────────────────────────────── */
    /*
      Each cell is square. Photos are displayed with
      object-fit: contain so they are NEVER cropped:
        • Landscape → fills full width, shorter height, white top/bottom
        • Portrait  → fills full height, narrower width, white left/right
    */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      gap: var(--gap);
      padding: 0 var(--gap) var(--gap);
    }

    .grid-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      background: #f8f8f8;  /* visible behind letter/pillar-box areas */
    }

    /* img fills the square cell, no cropping */
    .grid-cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      transition: opacity 0.25s;
    }

    .grid-cell:hover img { opacity: 0.80; }

    /* ── Lightbox ────────────────────────────────────────── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    #lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      user-select: none;
      /* pointer-events: none lets clicks fall through to the zone divs */
      pointer-events: none;
    }

    /* Left / right invisible hit zones for prev / next */
    .lb-zone {
      position: absolute;
      top: 0; bottom: 0;
      width: 50%;
      cursor: pointer;
      z-index: 1;
    }
    #lb-prev { left: 0; }
    #lb-next { right: 0; }

    /* Arrow hints */
    .lb-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.6rem;
      color: rgba(255,255,255,0.22);
      pointer-events: none;
      transition: color 0.2s;
      z-index: 2;
      line-height: 1;
    }
    #lb-arrow-left  { left: 22px; }
    #lb-arrow-right { right: 22px; }

    #lb-prev:hover ~ #lb-arrow-left,
    #lb-next:hover ~ #lb-arrow-right { color: rgba(255,255,255,0.65); }

    /* Close button */
    #lb-close {
      position: absolute;
      top: 24px; right: 28px;
      z-index: 2;
      background: none;
      border: none;
      color: rgba(255,255,255,0.55);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 8px 12px;
      transition: color 0.2s;
    }
    #lb-close:hover { color: #fff; }

    /* Photo counter */
    #lb-counter {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.38);
      pointer-events: none;
      z-index: 2;
      white-space: nowrap;
    }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 900px) { :root { --cols: 4; } }
    @media (max-width: 500px) { :root { --cols: 2; } }
    @media (max-width: 600px) {
      .project-nav    { padding: 0 24px; }
      .project-header { padding: calc(var(--nav-h) + 20px) 24px 20px; }
    }
  </style>
</head>

    /* ── Build grid ──────────────────────────────────────── */
    const grid = document.getElementById('photoGrid');

    PHOTOS.forEach((relPath, idx) => {
      // encodeURI handles spaces & non-ASCII in folder/file names
      const src = encodeURI(`${BASE_PATH}/${relPath}`);

      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.setAttribute('role', 'button');
      cell.setAttribute('tabindex', '0');
      cell.setAttribute('aria-label', `Open photo ${idx + 1}`);

      const img = document.createElement('img');
      img.src     = src;
      img.alt     = `Photo ${idx + 1}`;
      img.loading = 'lazy';

      cell.appendChild(img);
      cell.addEventListener('click', () => openLightbox(idx));
      cell.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') openLightbox(idx);
      });
      grid.appendChild(cell);
    });

    /* ── Lightbox ────────────────────────────────────────── */
    const lightbox  = document.getElementById('lightbox');
    const lbImg     = document.getElementById('lb-img');
    const lbCounter = document.getElementById('lb-counter');
    let currentIdx  = 0;

    function openLightbox(idx) {
      currentIdx = idx;
      showPhoto();
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function showPhoto() {
      lbImg.src       = encodeURI(`${BASE_PATH}/${PHOTOS[currentIdx]}`);
      lbImg.alt       = `Photo ${currentIdx + 1}`;
      lbCounter.textContent = `${currentIdx + 1} / ${PHOTOS.length}`;
    }

    function prevPhoto() {
      currentIdx = (currentIdx - 1 + PHOTOS.length) % PHOTOS.length;
      showPhoto();
    }

    function nextPhoto() {
      currentIdx = (currentIdx + 1) % PHOTOS.length;
      showPhoto();
    }

    document.getElementById('lb-prev').addEventListener('click', prevPhoto);
    document.getElementById('lb-next').addEventListener('click', nextPhoto);
    document.getElementById('lb-close').addEventListener('click', closeLightbox);

    /* Keyboard: Escape = close, ← → = navigate */
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  prevPhoto();
      if (e.key === 'ArrowRight') nextPhoto();
    });
